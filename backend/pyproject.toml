[project]
name = "vedai-assessment-extractor-backend"
version = "0.1.0"
description = "FastAPI foundation for the VedaAI assessment extraction platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "supabase>=2.9,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "google-genai>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
